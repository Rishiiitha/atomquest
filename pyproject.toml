[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 is excluded because the pipeline includes intentionally long SVG and Markdown literals;
# Ruff formatting still wraps normal Python expressions.
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

